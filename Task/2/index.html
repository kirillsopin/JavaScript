<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Новинна стрічка</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6fb;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        input, button {
            margin: 5px;
            padding: 8px;
        }

        .news {
            background: white;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
        }

        .controls {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<h1>Новинна стрічка</h1>

<div class="controls">
    <input type="text" id="title" placeholder="Заголовок">
    <input type="text" id="text" placeholder="Текст">
    <input type="text" id="tags" placeholder="Теги (через кому)">
    <button onclick="addNews()">Додати новину</button>

    <br>

    <input type="text" id="searchTag" placeholder="Пошук по тегу">
    <button onclick="searchByTag()">Пошук</button>

    <button onclick="sortNews()">Сортувати за датою</button>
</div>

<div id="newsList"></div>

<script src="script.js"></script>
</body>
</html>
