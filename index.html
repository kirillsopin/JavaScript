</html><!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Практика JS</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    text-align: center;
    padding: 30px;
}
.container {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 20px;
    margin: 20px auto;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #fff;
    color: #333;
    font-weight: bold;
}
input {
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}
.output {
    margin-top: 10px;
    font-size: 18px;
}
</style>
</head>
<body>

<div class="container">
    <h3>Калькулятор</h3>
    <input id="num1" placeholder="Число 1">
    <input id="num2" placeholder="Число 2"><br>
    <button onclick="sum()">Сума</button>
    <button onclick="mul()">Добуток</button>
    <div class="output" id="calcResult"></div>
</div>

<div class="container">
    <h3>Час</h3>
    <div id="timeDisplay"></div>
    <button onclick="addSec()">+30 сек</button>
    <button onclick="addMin()">+10 хв</button>
    <button onclick="addHr()">+1 год</button>
</div>

<div class="container">
    <h3>Авто</h3>
    <button onclick="showAuto()">Інфо авто</button>
    <button onclick="showDriver()">Водій</button>
    <button onclick="checkYear()">Перевірити рік</button>
    <button onclick="changeColor()">Змінити колір</button>
    <div class="output" id="autoOutput"></div>
</div>

<script src="script.js"></script>
</body>
</html>
