<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVG + Animation</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        svg {
            border: 1px solid #ccc;
            background: #f5f5f5;
        }

        .panel {
            margin-top: 20px;
        }

        button {
            margin-right: 10px;
            padding: 8px 12px;
        }

        #animBox {
            margin-top: 15px;
            height: 120px;
            position: relative;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<h2>SVG Demo</h2>
<div id="app"></div>

<h2>Animation Demo</h2>
<div class="panel">
    <div id="animBox"></div>

    <div style="margin-top:10px;">
        <button onclick="startAnim()">Start</button>
        <button onclick="pauseAnim()">Pause</button>
        <button onclick="resumeAnim()">Resume</button>
        <button onclick="stopAnim()">Stop</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
